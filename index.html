<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physical Racing</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud"></div>
<main id="menu" class="panel">
  <h1>Physical Racing</h1>
  <label class="field">Nickname
    <input id="name" maxlength="16" autocomplete="off" spellcheck="false" placeholder="Your name">
  </label>
  <section>
    <h2>Solo practice</h2>
    <div id="solo-tracks" class="track-list"></div>
  </section>
  <p class="hint">Arrows / WASD to drive · R to respawn · Esc for menu</p>
</main>
<script type="module" src="game/main.js"></script>
</body>
</html>
